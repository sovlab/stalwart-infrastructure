---
# Tear down first so setting backup_enabled back to false actually stops the
# nightly Stalwart restart and removes the credentials. The repository in S3
# is left alone: deleting backups is never a side effect of a playbook run.
- name: Check for an existing backup deployment
  ansible.builtin.stat:
    path: /etc/systemd/system/backup.timer
  register: backup_timer_unit
  when: not (backup_enabled | bool)

- name: Disable backups
  when:
    - not (backup_enabled | bool)
    - backup_timer_unit.stat.exists | default(false)
  block:
    - name: Stop and disable the backup timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - backup.timer
        - backup-check.timer

    - name: Remove backup credentials
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/resticprofile/restic-password
        - /etc/resticprofile/s3.env
        - /etc/resticprofile/notify.env
        - /etc/msmtprc

- name: Configure backups
  when: backup_enabled | bool
  block:
    - name: Validate required backup settings and credentials
      ansible.builtin.assert:
        that:
          - backup_repository | length > 0
          - backup_repository is match('s3:https://')
          - backup_s3_access_key | length > 0
          - backup_s3_secret_key | length > 0
          - backup_restic_password | length >= 20
          - backup_mailto | length > 0
          - backup_mail_from | length > 0
          - backup_smtp_password | length > 0
        fail_msg: >-
          Backups are enabled but the configuration is incomplete. Set
          backup_repository (s3:https://...), backup_mailto and
          backup_mail_from in group_vars/all.yml, and BACKUP_S3_ACCESS_KEY,
          BACKUP_S3_SECRET_KEY, BACKUP_RESTIC_PASSWORD (at least 20
          characters) and BACKUP_SMTP_PASSWORD in .env.

    - name: Install restic, msmtp and rsync
      ansible.builtin.apt:
        name: [restic, msmtp, rsync]
        state: present

    - name: Download resticprofile
      ansible.builtin.get_url:
        url: "https://github.com/creativeprojects/resticprofile/releases/download/v{{ resticprofile_version }}/resticprofile_no_self_update_{{ resticprofile_version }}_linux_amd64.tar.gz"
        dest: "/usr/local/src/resticprofile-{{ resticprofile_version }}.tar.gz"
        checksum: "sha256:{{ resticprofile_sha256 }}"
        mode: "0644"
      register: resticprofile_download

    - name: Install resticprofile
      ansible.builtin.unarchive:
        src: "/usr/local/src/resticprofile-{{ resticprofile_version }}.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include: [resticprofile]
        mode: "0755"
      when: resticprofile_download.changed

    - name: Create backup directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - /etc/resticprofile
        - "{{ backup_staging_dir }}"

    - name: Render resticprofile configuration
      ansible.builtin.template:
        src: profiles.yaml.j2
        dest: /etc/resticprofile/profiles.yaml
        mode: "0600"

    - name: Write backup credentials
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ item.dest }}"
        mode: "0600"
      loop:
        - dest: /etc/resticprofile/restic-password
          content: "{{ backup_restic_password }}\n"
        - dest: /etc/resticprofile/s3.env
          content: |
            AWS_ACCESS_KEY_ID={{ backup_s3_access_key }}
            AWS_SECRET_ACCESS_KEY={{ backup_s3_secret_key }}
            AWS_DEFAULT_REGION={{ backup_s3_region }}
        - dest: /etc/resticprofile/notify.env
          content: |
            MATTERMOST_WEBHOOK={{ backup_mattermost_webhook }}
      loop_control:
        label: "{{ item.dest }}"
      no_log: true

    - name: Configure msmtp for backup notifications
      ansible.builtin.template:
        src: msmtprc.j2
        dest: /etc/msmtprc
        mode: "0600"
      no_log: true

    - name: Install the rp wrapper
      ansible.builtin.copy:
        src: rp
        dest: /usr/local/sbin/rp
        mode: "0755"

    - name: Install backup scripts
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/usr/local/sbin/{{ item }}"
        mode: "0755"
      loop:
        - backup-pre
        - backup-notify

    - name: Install backup systemd units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - backup.service
        - backup.timer
        - backup-check.service
        - backup-check.timer
        - backup-notify@.service
      notify: Reload systemd

    - name: Apply unit changes before enabling the timers
      ansible.builtin.meta: flush_handlers

    # restic exits 10 when the repository does not exist. Any other failure
    # (wrong password, no network) fails the play rather than creating a
    # second repository.
    - name: Check whether the restic repository exists
      ansible.builtin.command:
        cmd: restic -r {{ backup_repository }} --password-file /etc/resticprofile/restic-password cat config
      environment: &restic_env
        AWS_ACCESS_KEY_ID: "{{ backup_s3_access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ backup_s3_secret_key }}"
        AWS_DEFAULT_REGION: "{{ backup_s3_region }}"
      register: backup_repo
      changed_when: false
      failed_when: backup_repo.rc not in [0, 10]

    - name: Initialise the restic repository
      ansible.builtin.command:
        cmd: restic -r {{ backup_repository }} --password-file /etc/resticprofile/restic-password init
      environment: *restic_env
      when: backup_repo.rc == 10
      changed_when: true

    - name: Enable the backup timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - backup.timer
        - backup-check.timer
