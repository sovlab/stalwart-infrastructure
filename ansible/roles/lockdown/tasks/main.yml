---
# Runs over a mesh connection (mailhosts group) - see inventory/hosts.yml.
# sshd listens on the mesh interfaces only: Tailscale (tailscale0) and NetBird
# (wt0), whichever are up. Both are bound while we move from Tailscale to
# NetBird; once tailscale0 is gone it simply drops out of the list.
# ssh.socket has FreeBind=yes, so binding a mesh address that isn't up yet at
# boot is fine.

- name: Read mesh interface addresses
  ansible.builtin.command: "ip -o addr show dev {{ item }} scope global"
  loop:
    - tailscale0
    - wt0
  register: mesh_addr_result
  changed_when: false
  failed_when: false
  check_mode: false

- name: Collect mesh addresses
  ansible.builtin.set_fact:
    mesh_addresses: >-
      {{ mesh_addr_result.results
         | selectattr('rc', 'equalto', 0)
         | map(attribute='stdout_lines') | flatten
         | map('split') | map(attribute=3)
         | map('regex_replace', '/.*$', '')
         | list }}

- name: Sanity check - confirm we are actually connected over a mesh
  ansible.builtin.assert:
    that:
      - ansible_host in mesh_addresses
    fail_msg: >-
      ansible_host ({{ ansible_host }}) is not one of this host's mesh
      addresses ({{ mesh_addresses | join(', ') }}). Refusing to bind sshd to
      the mesh only, to avoid locking out the current connection path. Check
      inventory/hosts.yml.

- name: Install sshd hardening drop-in
  ansible.builtin.template:
    src: 99-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    mode: "0644"
  notify: Restart sshd

- name: Validate the merged sshd configuration before restarting
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Flush handlers now so sshd is confirmed reloaded before continuing
  ansible.builtin.meta: flush_handlers
