---
# Only used while a host still has a Stalwart 0.16 store; see
# templates/docker-compose.migrate.yml.j2. An exact version rather than a
# series tag: this tool runs once, one way, and early 1.0.x releases fixed
# migrations that reported success while skipping data.
stalwart_migrate_version: "1.0.5"

# These two follow domain on a fresh install, which is what you want. On a
# live server they name things that already exist, so once domain changes
# (a new primary domain) they have to stay pinned to the old value in
# all.yml: the playbook's admin account keeps its address, and the plan
# finds its DNS provider by this description, so a new one would make it
# create a second provider rather than update the first.
stalwart_admin_domain: "{{ domain }}"
stalwart_dns_server_description: "cloudflare {{ domain }}"

# Former hostnames kept working after mail_hostname or webmail_hostname
# changes. Their DNS must still point here.
mail_hostname_aliases: []
webmail_hostname_aliases: []

# Permissions the built-in admin roles must hold. Stalwart only creates its
# default roles at first install, so a server upgraded across a release
# that adds permissions never gets them, and the matching admin console
# sections stay hidden. Anything listed here that an admin role lacks is
# granted on the next playbook run. The seeded admin cannot grant
# permissions it does not hold itself, so that grant runs as the recovery
# admin; see "New permissions after an upgrade" in MAINTENANCE.md. When a
# release note asks for permissions to be granted by hand, add them here.
stalwart_admin_role_permissions:
  # 1.0.2: Encryption, External Public Keys and S/MIME Trust Anchors
  - sysEncryptionGet
  - sysEncryptionUpdate
  - sysExternalPublicKeyGet
  - sysExternalPublicKeyCreate
  - sysExternalPublicKeyUpdate
  - sysExternalPublicKeyDestroy
  - sysExternalPublicKeyQuery
  - sysSmimeTrustAnchorGet
  - sysSmimeTrustAnchorCreate
  - sysSmimeTrustAnchorUpdate
  - sysSmimeTrustAnchorDestroy
  - sysSmimeTrustAnchorQuery
  - taskExternalPublicKeyMaintenance
  # 1.0.3: Symmetric Keys (blob encryption) and the Blob Recode task. A new
  # install gives no role sysSymmetricKeyDestroy, so it is left out here too.
  - sysSymmetricKeyGet
  - sysSymmetricKeyCreate
  - sysSymmetricKeyUpdate
  - sysSymmetricKeyQuery
  - taskBlobRecode
