---
- name: Fail early if required secrets and accounts are missing
  ansible.builtin.assert:
    that:
      - cloudflare_api_token | default("", true) | length > 0
      - s3_endpoint | default("", true) | length > 0
      - s3_bucket | default("", true) | length > 0
      - s3_access_key | default("", true) | length > 0
      - s3_secret_key | default("", true) | length > 0
      - stalwart_recovery_password | default("", true) | length > 0
      - bulwark_admin_password | default("", true) | length > 0
      - stalwart_accounts | default([], true) | length > 0
      - stalwart_admin_account in (stalwart_accounts | map(attribute="name") | list)
      - stalwart_accounts | rejectattr("password", "defined") | list | length == 0
    fail_msg: >-
      Configuration is incomplete. CLOUDFLARE_API_TOKEN, S3_ACCESS_KEY and
      S3_SECRET_KEY must be set in .env; s3_endpoint and s3_bucket,
      stalwart_recovery_password, bulwark_admin_password, stalwart_admin_account
      and stalwart_accounts must be set in group_vars/all.yml, every account
      needs a password, and stalwart_admin_account must name one of them.
      The Cloudflare token is no longer optional: Stalwart uses it to publish
      DNS records and to answer the ACME DNS-01 challenge when it renews its
      own certificate.

- name: Create mail stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ mailstack_dir }}"
    - "{{ mailstack_dir }}/caddy-config"
    - "{{ data_dir }}/caddy/data"
    - "{{ data_dir }}/caddy/config"

# Stalwart's own two directories are created separately because the
# container runs as an unprivileged user (uid 2000) and has to be able to
# write both: config.json into /etc/stalwart, and RocksDB + blobs into
# /var/lib/stalwart. Named volumes inherit the right ownership on their
# own; bind mounts keep whatever the host gave them, which would be
# root:root here, and the server exits on the first write it can't make.
- name: Create Stalwart's directories, owned by the container's uid
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: "2000"
    group: "2000"
  loop:
    - "{{ data_dir }}/stalwart/etc"
    - "{{ data_dir }}/stalwart/data"

# --- store format guard -------------------------------------------------
# Stalwart 1.0 cannot open a 0.16 store; the upgrade is a copy into a new
# store with stalwart-migrate. The image tag in docker-compose.yml.j2 alone
# would happily point 1.0 at the old store on the next run, so the store
# carries a marker instead: .store-v1 sits next to etc/ and data/, outside
# both container mounts, and moves with the directory at cutover.
#
# A store without the marker is a 0.16 store. The playbook then sets up the
# migration directories and tool, and stops before touching the running
# stack. A fresh host has no store yet, so 1.0 creates one and it is marked
# straight away.

- name: Check for an existing Stalwart data store
  ansible.builtin.stat:
    path: "{{ data_dir }}/stalwart/data/db"
  register: stalwart_store

- name: Check whether the store is in the 1.0 format
  ansible.builtin.stat:
    path: "{{ data_dir }}/stalwart/.store-v1"
  register: stalwart_store_v1

- name: Mark a fresh store as 1.0 format
  ansible.builtin.copy:
    content: "Stalwart 1.0 store. Written by roles/mailstack; see MAINTENANCE.md before deleting.\n"
    dest: "{{ data_dir }}/stalwart/.store-v1"
    mode: "0644"
  when: not stalwart_store.stat.exists

- name: Prepare the Stalwart 0.16 to 1.0 migration
  when: stalwart_store.stat.exists and not stalwart_store_v1.stat.exists
  block:
    - name: Create the migration target and state directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
        owner: "2000"
        group: "2000"
      loop:
        - "{{ data_dir }}/stalwart-v1/etc"
        - "{{ data_dir }}/stalwart-v1/data"
        - "{{ data_dir }}/stalwart-migrate"

    # The same template as the live config.json, on purpose: the target
    # names /var/lib/stalwart/db, and the tool is told where that really is
    # with --target-path-map.
    - name: Render the migration target's data store configuration
      ansible.builtin.template:
        src: config.json.j2
        dest: "{{ data_dir }}/stalwart-v1/etc/config.json"
        owner: "2000"
        group: "2000"
        mode: "0640"

    - name: Mark the migration target as 1.0 format
      ansible.builtin.copy:
        content: "Stalwart 1.0 store. Written by roles/mailstack; see MAINTENANCE.md before deleting.\n"
        dest: "{{ data_dir }}/stalwart-v1/.store-v1"
        mode: "0644"

    - name: Render the migration compose file
      ansible.builtin.template:
        src: docker-compose.migrate.yml.j2
        dest: "{{ mailstack_dir }}/docker-compose.migrate.yml"
        mode: "0644"

    - name: Stop before deploying Stalwart 1.0 over a 0.16 store
      ansible.builtin.fail:
        msg: >-
          {{ data_dir }}/stalwart holds a Stalwart 0.16 store, which 1.0
          cannot open. The running stack was left alone. The migration
          tool is ready in {{ mailstack_dir }}/docker-compose.migrate.yml;
          follow "Migrating from Stalwart 0.16 to 1.0" in MAINTENANCE.md,
          then re-run this playbook.

- name: Remove the migration compose file once the store is on 1.0
  ansible.builtin.file:
    path: "{{ mailstack_dir }}/docker-compose.migrate.yml"
    state: absent

# Same reasoning as Stalwart's directories above: the bulwark image runs
# as uid 1001, and a root:root bind mount leaves it unable to write its
# own audit log or persist admin-configured settings (including the
# OAuth client Bulwark's own "Auto-configure OAuth" admin action creates).
- name: Create Bulwark's directories, owned by the container's uid
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: "1001"
    group: "1001"
  loop:
    - "{{ data_dir }}/bulwark/admin"
    - "{{ data_dir }}/bulwark/admin-state"
    - "{{ data_dir }}/bulwark/settings"

- name: Render Stalwart's data store configuration
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ data_dir }}/stalwart/etc/config.json"
    owner: "2000"
    group: "2000"
    mode: "0640"
  no_log: true

- name: Render the declarative configuration plan
  ansible.builtin.template:
    src: plan.ndjson.j2
    dest: "{{ mailstack_dir }}/plan.ndjson"
    mode: "0600"   # embeds the Cloudflare token and the S3 secret
  no_log: true

# The same plan with the seed folded in, applied only while provisioning; see
# the headers of seed.ndjson.j2 for why re-applying the seed to a live server
# is harmful, and of the SystemSettings op in plan.ndjson.j2 for the order.
- name: Render the provisioning plan
  ansible.builtin.template:
    src: plan.ndjson.j2
    dest: "{{ mailstack_dir }}/provision.ndjson"
    mode: "0600"   # embeds every seeded account password
  vars:
    provisioning: true
  no_log: true

# stalwart-cli credentials go in env files rather than on the `docker run`
# command line: that keeps them out of `ps` and out of Ansible's own output,
# which in turn means the apply tasks below do not need no_log and their
# errors stay readable when something in the plan is rejected.
- name: Write stalwart-cli credentials for recovery-mode provisioning
  ansible.builtin.copy:
    content: |
      STALWART_URL=http://stalwart:8080
      STALWART_USER=admin
      STALWART_PASSWORD={{ stalwart_recovery_password }}
    dest: "{{ mailstack_dir }}/.cli-recovery.env"
    mode: "0600"
  no_log: true

- name: Write stalwart-cli credentials for the running server
  ansible.builtin.copy:
    content: |
      STALWART_URL=https://{{ mail_hostname }}
      STALWART_USER={{ stalwart_admin_account }}@{{ stalwart_admin_domain }}
      STALWART_PASSWORD={{ stalwart_accounts | selectattr('name', 'eq', stalwart_admin_account) | map(attribute='password') | first }}
    dest: "{{ mailstack_dir }}/.cli.env"
    mode: "0600"
  no_log: true

# Group docker rather than world-readable: it carries Bulwark's session
# secret and initial admin password, and {{ admin_user }} still needs to
# read it to run `docker compose` without sudo.
- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ mailstack_dir }}/docker-compose.yml"
    group: docker
    mode: "0640"

- name: Render the recovery-mode compose overlay
  ansible.builtin.template:
    src: docker-compose.recovery.yml.j2
    dest: "{{ mailstack_dir }}/docker-compose.recovery.yml"
    mode: "0600"   # embeds the recovery admin credential
  no_log: true

- name: Render the recovery-admin compose overlay
  ansible.builtin.template:
    src: docker-compose.recovery-admin.yml.j2
    dest: "{{ mailstack_dir }}/docker-compose.recovery-admin.yml"
    mode: "0600"   # embeds the recovery admin credential
  no_log: true

- name: Render Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ mailstack_dir }}/caddy-config/Caddyfile"
    mode: "0644"

- name: Copy caddy build Dockerfile
  ansible.builtin.copy:
    src: Dockerfile.caddy
    dest: "{{ mailstack_dir }}/caddy-config/Dockerfile"
    mode: "0644"

# --- provisioning -------------------------------------------------------
# A server with a config.json but an empty database cannot be reached: it
# starts normally, finds no accounts, and offers no wizard, because the
# wizard only runs when config.json is absent. Stalwart's answer is recovery
# mode - management API only, mail services down, a temporary admin from the
# environment - which is where the plan gets applied. Once that has
# succeeded the marker below keeps every later run on the ordinary path,
# applying the plan to the live server instead.

# `docker run` only pulls an image the host does not already have, so a host
# keeps whichever CLI it pulled first. The CLI parses the server's
# /api/schema, and one older than the server can fail on it outright: the
# 1.0.12 cached on mail01 could not read Stalwart 1.0.2's schema, which
# broke the apply mid-cutover. Pulling the pinned tag every run keeps the
# host on the version group_vars names.
- name: Pull the pinned stalwart-cli image
  ansible.builtin.command: docker pull {{ stalwart_cli_image }}
  register: stalwart_cli_pull
  changed_when: "'Downloaded newer image' in stalwart_cli_pull.stdout"

- name: Check whether this server has already been provisioned
  ansible.builtin.stat:
    path: "{{ mailstack_dir }}/.provisioned"
  register: stalwart_provisioned

- name: Provision a fresh server
  when: not stalwart_provisioned.stat.exists
  block:
    - name: Start the stack with Stalwart in recovery mode
      ansible.builtin.command:
        cmd: >-
          docker compose -f docker-compose.yml -f docker-compose.recovery.yml
          up -d --build --remove-orphans
        chdir: "{{ mailstack_dir }}"
      changed_when: true

    - name: Wait for the recovery management API
      ansible.builtin.command:
        cmd: >-
          docker run --rm --network mailstack_internal
          --env-file {{ mailstack_dir }}/.cli-recovery.env
          {{ stalwart_cli_image }} describe
        chdir: "{{ mailstack_dir }}"
      register: stalwart_recovery_ready
      changed_when: false
      failed_when: false
      until: stalwart_recovery_ready.rc == 0
      retries: 20
      delay: 5

    - name: Fail if the recovery API never came up
      ansible.builtin.fail:
        msg: >-
          Stalwart's recovery API did not answer within 100s. Check
          `docker compose logs stalwart` in {{ mailstack_dir }}.
      when: stalwart_recovery_ready.rc != 0

    # The plan arrives on stdin rather than as a bind mount. The CLI image
    # runs as a non-root user, so it cannot read a 0600 root-owned file
    # mounted into the container, and both files have to stay 0600: they
    # carry the Cloudflare token and every account password. Piping
    # sidesteps the ownership question entirely and keeps the files off the
    # container's filesystem.
    - name: Apply the provisioning plan
      ansible.builtin.shell:
        cmd: >-
          docker run --rm -i --network mailstack_internal
          --env-file {{ mailstack_dir }}/.cli-recovery.env
          {{ stalwart_cli_image }} apply --stdin
          < {{ mailstack_dir }}/provision.ndjson
        chdir: "{{ mailstack_dir }}"
      register: stalwart_apply
      changed_when: true

    - name: Record that provisioning succeeded
      ansible.builtin.copy:
        content: "Provisioned by roles/mailstack. Delete to force re-provisioning from scratch.\n"
        dest: "{{ mailstack_dir }}/.provisioned"
        mode: "0644"

    - name: Restart Stalwart without the recovery credentials
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate stalwart
        chdir: "{{ mailstack_dir }}"
      changed_when: true

# --remove-orphans because Ansible owns this compose project outright: a
# container left behind by a service that has since been removed from the
# template (postgres, when the data store moved to RocksDB) keeps holding an
# endpoint on the network, and compose then cannot recreate that network to
# apply a changed subnet. It fails the run rather than working around it.
- name: Deploy the mail stack
  ansible.builtin.command:
    cmd: docker compose up -d --build --remove-orphans
    chdir: "{{ mailstack_dir }}"
  register: compose_up
  changed_when: >-
    'Started' in compose_up.stderr or 'Created' in compose_up.stderr
    or 'Recreated' in compose_up.stderr

# `up -d` returns as soon as the container starts, which is several seconds
# before Stalwart opens its listeners. An apply sent in that gap reaches
# Caddy, finds nothing on 8080, and fails with HTTP 502; that is exactly
# what happened on the first 1.0 start. Same probe as the recovery wait
# above, through the public hostname this time.
- name: Wait for Stalwart's management API
  ansible.builtin.command:
    cmd: >-
      docker run --rm
      --env-file {{ mailstack_dir }}/.cli.env
      {{ stalwart_cli_image }} describe
    chdir: "{{ mailstack_dir }}"
  when: stalwart_provisioned.stat.exists
  register: stalwart_ready
  changed_when: false
  until: stalwart_ready.rc == 0
  retries: 24
  delay: 5

# --- admin role permissions -------------------------------------------
# Stalwart creates its default roles once, at first install. A release that
# adds permissions (1.0.2 added the encryption ones) leaves upgraded servers
# without them, and the admin console hides whatever they guard. The seeded
# admin cannot fix that itself: Stalwart refuses to let anyone grant a
# permission they do not hold. So when something is missing, Stalwart is
# briefly recreated with the recovery admin set, the grant runs as that
# admin, and Stalwart is recreated again without it. That costs two short
# restarts, and only on the run that does the grant. This runs before the
# plan so the plan can configure anything the new permissions guard.
- name: Read the built-in roles and their permissions
  ansible.builtin.uri:
    url: "https://{{ mail_hostname }}/jmap/"
    method: POST
    url_username: "{{ stalwart_admin_account }}@{{ stalwart_admin_domain }}"
    url_password: >-
      {{ stalwart_accounts | selectattr('name', 'eq', stalwart_admin_account)
         | map(attribute='password') | first }}
    force_basic_auth: true
    body_format: json
    body:
      using: ["urn:ietf:params:jmap:core", "urn:stalwart:jmap"]
      methodCalls:
        - ["x:Authentication/get", {ids: [singleton], properties: [defaultAdminRoleIds, defaultUserRoleIds]}, auth]
        - ["x:Role/get", {ids: null}, roles]
  when: stalwart_provisioned.stat.exists
  register: stalwart_roles
  failed_when: >-
    stalwart_roles.status != 200
    or 'error' in (stalwart_roles.json.methodResponses | map('first'))

# The admin roles are the ones in defaultAdminRoleIds that are not also
# user roles; on mail01 that is System Administrator, alongside User.
- name: Find admin roles missing required permissions
  ansible.builtin.set_fact:
    stalwart_roles_to_grant: >-
      {{ stalwart_roles.json.methodResponses[1][1].list
         | selectattr('id', 'in', stalwart_admin_role_ids)
         | rejectattr('enabledPermissions', 'superset', stalwart_admin_role_permissions)
         | map(attribute='id') | list }}
  vars:
    stalwart_auth: "{{ stalwart_roles.json.methodResponses[0][1].list[0] }}"
    stalwart_admin_role_ids: >-
      {{ stalwart_auth.defaultAdminRoleIds | list
         | difference(stalwart_auth.defaultUserRoleIds | default({}) | list) }}
  when: stalwart_provisioned.stat.exists

- name: Grant missing permissions to the admin roles
  when:
    - stalwart_provisioned.stat.exists
    - stalwart_roles_to_grant | default([]) | length > 0
  block:
    - name: Restart Stalwart with the recovery admin
      ansible.builtin.command:
        cmd: >-
          docker compose -f docker-compose.yml -f docker-compose.recovery-admin.yml
          up -d stalwart
        chdir: "{{ mailstack_dir }}"
      changed_when: true

    - name: Wait for Stalwart's management API with the recovery admin
      ansible.builtin.command:
        cmd: >-
          docker run --rm
          --env-file {{ mailstack_dir }}/.cli.env
          {{ stalwart_cli_image }} describe
        chdir: "{{ mailstack_dir }}"
      register: stalwart_ready_ra
      changed_when: false
      until: stalwart_ready_ra.rc == 0
      retries: 24
      delay: 5

    # Every listed permission is sent, not only the missing ones: setting
    # one the role already holds is a no-op, and it keeps the patch simple.
    - name: Grant the permissions as the recovery admin
      ansible.builtin.uri:
        url: "https://{{ mail_hostname }}/jmap/"
        method: POST
        url_username: admin
        url_password: "{{ stalwart_recovery_password }}"
        force_basic_auth: true
        body_format: json
        body:
          using: ["urn:ietf:params:jmap:core", "urn:stalwart:jmap"]
          methodCalls:
            - ["x:Role/set", {update: "{{ dict(stalwart_roles_to_grant | zip([stalwart_role_patch] * (stalwart_roles_to_grant | length))) }}"}, grant]
      vars:
        stalwart_role_patch: >-
          {{ dict(stalwart_admin_role_permissions | map('regex_replace', '^', 'enabledPermissions/')
                  | zip([true] * (stalwart_admin_role_permissions | length))) }}
      register: stalwart_grant
      changed_when: true
      failed_when: >-
        stalwart_grant.status != 200
        or stalwart_grant.json.methodResponses[0][0] == 'error'
        or (stalwart_grant.json.methodResponses[0][1].updated | default({}) | list | sort)
           != (stalwart_roles_to_grant | sort)

  always:
    - name: Restart Stalwart without the recovery admin
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate stalwart
        chdir: "{{ mailstack_dir }}"
      changed_when: true

    - name: Wait for Stalwart's management API after the grant
      ansible.builtin.command:
        cmd: >-
          docker run --rm
          --env-file {{ mailstack_dir }}/.cli.env
          {{ stalwart_cli_image }} describe
        chdir: "{{ mailstack_dir }}"
      register: stalwart_ready_after
      changed_when: false
      until: stalwart_ready_after.rc == 0
      retries: 24
      delay: 5

# Re-applying against the running server is what makes configuration
# changes declarative: edit group_vars, re-run the playbook, and the plan
# reconciles. Every operation is an upsert or a singleton update, so this
# converges rather than duplicating. The seed is deliberately not part of
# it: accounts, domains and the ACME provider belong to the admin console
# once the server exists.
#
# It authenticates as stalwart_admin_account, one of the seeded accounts,
# which is why no separate API token is needed. The seed no longer resets
# that password, so if it is changed in the console, change it in
# group_vars to match or this task fails to log in.
- name: Apply the configuration plan to the running server
  ansible.builtin.shell:
    cmd: >-
      docker run --rm -i
      --env-file {{ mailstack_dir }}/.cli.env
      {{ stalwart_cli_image }} apply --stdin
      < {{ mailstack_dir }}/plan.ndjson
    chdir: "{{ mailstack_dir }}"
  when: stalwart_provisioned.stat.exists
  register: stalwart_reapply
  changed_when: true

# apply stores the new settings but the running server keeps the old ones
# until it reloads. A changed defaultHostname went unnoticed this way: the
# SMTP greeting, the OAuth issuer and every DNS record Stalwart published
# kept the old name until a reload was run by hand. Reloading is cheap and
# does not restart anything, so it runs every time.
- name: Reload Stalwart's settings
  ansible.builtin.command:
    cmd: >-
      docker run --rm
      --env-file {{ mailstack_dir }}/.cli.env
      {{ stalwart_cli_image }} create Action/ReloadSettings --json {}
    chdir: "{{ mailstack_dir }}"
  when: stalwart_provisioned.stat.exists
  register: stalwart_reload
  changed_when: true

# The reload reports what it could not build, and nothing else surfaces it.
# This is how a licence that no longer matches the hostname showed up.
- name: Show warnings from the settings reload
  ansible.builtin.debug:
    msg: "{{ stalwart_reload.stdout }}"
  when:
    - stalwart_reload is not skipped
    - "'\"warnings\": {}' not in stalwart_reload.stdout"

# --- retired data volume ------------------------------------------------
# Earlier versions of this repo put {{ data_dir }} on a dedicated block
# device, formatted and mounted by roles/bootstrap. That is gone, but the
# fstab line it wrote is not: removing an ansible.posix.mount task does not
# remove its entry, so the old volume keeps remounting at every boot.
#
# The guard matters. Dropping the fstab line while the volume is still
# mounted would leave the running system on the volume and the next boot on
# an empty directory of the same name underneath it, with the data intact
# but invisible. So this only tidies fstab once an operator has actually
# unmounted the volume by hand; until then it does nothing and says so.
- name: Check whether {{ data_dir }} is still a separate mount
  ansible.builtin.command: "mountpoint -q {{ data_dir }}"
  register: data_dir_is_mount
  changed_when: false
  failed_when: false

- name: Warn that the retired data volume is still mounted
  ansible.builtin.debug:
    msg: >-
      {{ data_dir }} is still a separate mounted volume. This repo no longer
      needs one. To retire it: stop the stack, copy anything you want to
      keep off {{ data_dir }}, `umount {{ data_dir }}`, then re-run this
      playbook and it will remove the fstab entry. The disk can then be
      detached at your VPS provider.
  when: data_dir_is_mount.rc == 0

- name: Remove the retired data volume from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^[^#]*\\s{{ data_dir | regex_escape }}\\s"
    state: absent
  when: data_dir_is_mount.rc != 0

# --- cert sync removal ------------------------------------------------
# Stalwart issues and renews its own certificate now (ACME with the DNS-01
# challenge, via the Cloudflare integration configured in the setup wizard),
# so the timer that used to copy Caddy's cert into Stalwart is gone. There
# is nothing left to copy: v0.16 keeps certificates in the data store as
# Certificate objects rather than as files on disk, and the API endpoint the
# old script called to reload them no longer exists.
#
# These three tasks only clean up hosts provisioned before that change.
# They can be deleted once every host has run this playbook at least once.

- name: Stop and disable the retired cert-sync timer
  ansible.builtin.systemd:
    name: mailstack-cert-sync.timer
    enabled: false
    state: stopped
  failed_when: false

- name: Remove the retired cert-sync files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/mailstack-cert-sync.timer
    - /etc/systemd/system/mailstack-cert-sync.service
    - "{{ mailstack_dir }}/sync-certs.sh"
    - "{{ data_dir }}/stalwart/cert"
  register: cert_sync_removed

- name: Reload systemd after removing the cert-sync units
  ansible.builtin.systemd:
    daemon_reload: true
  when: cert_sync_removed.changed
