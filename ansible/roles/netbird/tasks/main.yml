---
# Joins the SovLab NetBird mesh, alongside Tailscale while we switch over.
- name: Add NetBird apt signing key
  ansible.builtin.get_url:
    url: https://pkgs.netbird.io/debian/public.key
    dest: /usr/share/keyrings/netbird-archive-keyring.asc
    mode: "0644"

- name: Add NetBird apt repository
  ansible.builtin.deb822_repository:
    name: netbird
    types: [deb]
    uris: https://pkgs.netbird.io/debian
    suites: [stable]
    components: [main]
    signed_by: /usr/share/keyrings/netbird-archive-keyring.asc

- name: Install the NetBird client (pinned)
  ansible.builtin.apt:
    name: "netbird={{ netbird_version }}"
    update_cache: true
    allow_change_held_packages: true

- name: Hold the NetBird client version
  ansible.builtin.dpkg_selections:
    name: netbird
    selection: hold

- name: Enable and start the NetBird service
  ansible.builtin.systemd:
    name: netbird
    enabled: true
    state: started

- name: Check current NetBird status
  ansible.builtin.command: netbird status
  register: netbird_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Fail early if NETBIRD_SETUP_KEY is needed but not set
  ansible.builtin.assert:
    that:
      - netbird_setup_key | length > 0
    fail_msg: >-
      This host isn't enrolled yet and NETBIRD_SETUP_KEY is empty. Get it from
      mail-shared-platform (tofu -chdir=tofu/envs/hub output -raw
      netbird_setup_key_mail01) and export it for this run.
  when: "'Management: Connected' not in netbird_status.stdout"

- name: Join the mesh
  ansible.builtin.command: >-
    netbird up
    --management-url {{ netbird_management_url }}
    --setup-key {{ netbird_setup_key }}
    --hostname {{ netbird_hostname }}
  when: "'Management: Connected' not in netbird_status.stdout"
  no_log: true
  changed_when: true

# Enrolling only happens once, so a new netbird_management_url (e.g. the
# move to netbird.sovlab.ca, ADR 0032 step 2 in mail-shared-platform) needs
# its own step. Same server, so the peer keeps its key: no setup key needed.
# Runs detached so a dropped mesh session can't leave it half done, and goes
# back to the old URL if the new one doesn't connect within 60 s.
- name: Read the current management URL
  ansible.builtin.command: netbird status --json
  register: netbird_status_json
  changed_when: false
  failed_when: false
  check_mode: false
  when: "'Management: Connected' in netbird_status.stdout"

- name: Move to the configured management URL
  when:
    - "'Management: Connected' in netbird_status.stdout"
    - netbird_current_host | length > 0
    - netbird_current_host != netbird_wanted_host
  vars:
    netbird_current_host: >-
      {{ ((netbird_status_json.stdout | default('{}') | from_json).management | default({})).url | default('')
         | urlsplit('hostname') if (netbird_status_json.stdout | default('')) is match('\s*{') else '' }}
    netbird_wanted_host: "{{ netbird_management_url | urlsplit('hostname') }}"
  block:
    - name: Management URL to move
      ansible.builtin.debug:
        msg: "{{ netbird_current_host }} -> {{ netbird_wanted_host }}{{ ' (check mode: not moved)' if ansible_check_mode else '' }}"

    - name: Re-point (detached, falls back to the old URL)
      ansible.builtin.command:
        argv:
          - systemd-run
          - --unit=netbird-repoint
          - --collect
          - /bin/sh
          - -c
          - >-
            netbird down;
            netbird up --management-url {{ netbird_management_url }};
            for i in $(seq 30); do sleep 2;
            netbird status --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["management"];
            sys.exit(0 if d["connected"] and "{{ netbird_wanted_host }}" in d["url"] else 1)' && exit 0; done;
            echo "new management URL not connected after 60 s, back to https://{{ netbird_current_host }}";
            netbird down; netbird up --management-url https://{{ netbird_current_host }}; exit 1
      changed_when: true

    # Check mode skips the re-point, so there is nothing to wait for or verify.
    - name: Wait for the connection to come back
      ansible.builtin.wait_for_connection:
        delay: 15
        timeout: 180
      when: not ansible_check_mode

    - name: Check the management URL after the move
      ansible.builtin.command: netbird status --json
      register: netbird_after
      changed_when: false
      retries: 6
      delay: 10
      until: >-
        (netbird_after.stdout | from_json).management.connected
        and netbird_wanted_host in (netbird_after.stdout | from_json).management.url
      when: not ansible_check_mode

- name: Wait for the wt0 address
  ansible.builtin.command: ip -4 -o addr show dev wt0
  register: netbird_wt0
  until: netbird_wt0.rc == 0 and 'inet ' in netbird_wt0.stdout
  retries: 15
  delay: 2
  changed_when: false
  check_mode: false

- name: Show the NetBird IP
  ansible.builtin.debug:
    msg: "NetBird IPv4 for this host is {{ netbird_wt0.stdout.split()[3].split('/')[0] }}."
